name: Supervisory revision checks
concurrency:
  group: supervisory-${{ github.ref }}
  cancel-in-progress: true
on:
  workflow_dispatch:
  push:
    branches: [codex/paper1-supervisory-costs-20261105]
    paths:
      - '.github/workflows/supervisory-release.yml'
      - 'studies/supervisory_release_20261105/**'
jobs:
  tagged-flow:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install numpy
      - run: python studies/paper1_uplift_20261105/flow_decision.py
      - run: python studies/paper1_uplift_20261105/flow_falsification.py
  accounting:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install numpy scipy
      - run: python studies/supervisory_release_20261105/run_study.py
      - uses: actions/upload-artifact@v4
        with:
          name: supervisory-accounting
          path: studies/supervisory_release_20261105/results/
  lean:
    permissions:
      contents: write
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install declared Lean toolchain
        run: |
          curl -sSf https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh | sh -s -- -y
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - name: Obtain Mathlib cache
        working-directory: research_extension/current_manuscript_lean_20261008
        run: lake exe cache get
      - name: Build all proofs and audit every project axiom dependency
        working-directory: research_extension/current_manuscript_lean_20261008
        run: |
          python3 ../../studies/supervisory_release_20261105/tools/verify_release.py --project . --repo ../..
          lake env lean ../../studies/supervisory_release_20261105/Robustness.lean
      - name: Persist source-bound proof receipts
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add research_extension/current_manuscript_lean_20261008/paper1_release_receipt.json research_extension/current_manuscript_lean_20261008/paper1_release_axioms.jsonl research_extension/current_manuscript_lean_20261008/Paper1ReleaseAudit.lean
          if ! git diff --cached --quiet; then
            git commit -m 'Record source-bound Paper 1 proof audit [skip ci]'
            git pull --rebase origin codex/paper1-supervisory-costs-20261105
            git push origin HEAD:codex/paper1-supervisory-costs-20261105
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: paper1-full-proof-audit
          path: |
            research_extension/current_manuscript_lean_20261008/paper1_release_receipt.json
            research_extension/current_manuscript_lean_20261008/paper1_release_axioms.jsonl
  manuscript:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y latexmk texlive-latex-extra texlive-fonts-recommended lmodern
      - working-directory: ceiling_suite/papers/paper1
        run: |
          latexmk -pdf -interaction=nonstopmode -halt-on-error paper1_ssrn.tex
          latexmk -pdf -interaction=nonstopmode -halt-on-error paper1.tex
      - uses: actions/upload-artifact@v4
        with:
          name: updated-paper1-pdfs
          path: ceiling_suite/papers/paper1/paper1*.pdf


