name: Machine Markets & AMIP RFC-001 CI

permissions:
  contents: read

on:
  push:
    branches: [ main, master, paper2-information-safety ]
  pull_request:
    branches: [ main, master, paper2-information-safety ]
  workflow_dispatch:

jobs:
  lint:
    name: Code Quality & Linting
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Lint Tools
        run: pip install ruff

      - name: Run Ruff Linter
        run: ruff check .

  lean-formal-audit:
    name: Lean 4 Formal Mechanization Audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Elan & Lean 4
        run: |
          curl -sSf https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh | sh -s -- -y --default-toolchain leanprover/lean4:v4.34.1
          echo "$HOME/.elan/bin" >> $GITHUB_PATH

      - name: Build Lean Proofs Package
        working-directory: research_extension/current_manuscript_lean_20261008
        run: |
          lake exe cache get || true
          lake build

      - name: Audit All Mechanized Theorems (0 Sorry Verification)
        working-directory: research_extension/current_manuscript_lean_20261008
        run: lake env lean AxiomAudit.lean

      - name: Run Formal Verification Script
        working-directory: research_extension/current_manuscript_lean_20261008
        run: python verify_formalization.py

      - name: Build Core Constructive Lean Proofs & Verify Ceiling Suite Manifest
        run: |
          cd lean_proofs && lake build && lake env lean AxiomAudit.lean
          cd ..
          python ceiling_suite/verify_ceiling_suite_lean_proofs.py

      - name: Upload regenerated audit files
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lean-audit
          path: |
            research_extension/current_manuscript_lean_20261008/checked_theorem_types.json
            research_extension/current_manuscript_lean_20261008/axiom_audit.jsonl
            research_extension/current_manuscript_lean_20261008/named_declarations.json
            research_extension/current_manuscript_lean_20261008/formal_verification_receipt.json
            research_extension/current_manuscript_lean_20261008/AxiomAudit.lean
            ceiling_suite/CEILING_SUITE_LEAN_PROOF_MANIFEST.json
            ceiling_suite/CEILING_SUITE_LEAN_PROOF_REPORT.md

  paper-suite:
    name: Paper Suite Clean Reproduction (tests, results, LaTeX, ledger)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install TeX Live and Poppler
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends texlive-latex-base texlive-latex-recommended \
            texlive-latex-extra texlive-fonts-recommended lmodern poppler-utils

      - name: End-to-end clean reproduction (Lean is checked in its own job)
        shell: bash
        run: |
          set -o pipefail
          if ! SKIP_LEAN=1 sh reproduce_paper_suite.sh 2>&1 | tee suite.log; then
            # surface the end of the log as annotations (readable without downloading the job log)
            grep -nE "DIFFERENT|TEXT DIFFERS|MISMATCH|Error|error|FAILED|Traceback|No such file|not found" suite.log | tail -8 | while read -r line; do echo "::error::${line}"; done
            echo "::error::last lines: $(tail -12 suite.log | tr '\n' '|' | cut -c1-900)"
            exit 1
          fi
          { grep -E "TEXT DIFFERS" suite.log || true; } | while read -r line; do echo "::warning::${line}"; done
          grep -E "done: all checks passed" suite.log

  test-matrix:
    name: Pytest Suite (${{ matrix.os }}, Python ${{ matrix.python-version }})
    needs: [lint, lean-formal-audit]
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        python-version: ["3.11"]

    steps:
      - uses: actions/checkout@v4

      - name: Use the Lean audit files regenerated by this run's kernel-checked build
        uses: actions/download-artifact@v4
        with:
          name: lean-audit
          path: .

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-runtime.txt -r requirements-artifacts.txt
          pip install pypdf

      - name: Run P0-2 Full-Domain Outward-Rounded Certificate Audit
        run: python scripts/independent_checks/verify_p02_full_domain_certificate.py

      - name: Run Independent Oracle & Falsification Suite
        run: python scripts/independent_checks/independent_oracle_and_falsification.py

      - name: Run Breakthrough Scientific Tests
        run: pytest tests/test_breakthrough_experiments.py -v

      - name: Run Pytest Suite
        run: pytest tests/ -v

  build-master-pdf:
    name: Compile Master Publication PDF
    needs: [test-matrix, lean-formal-audit]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install TeX Live
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            texlive-latex-base \
            texlive-latex-recommended \
            texlive-latex-extra \
            texlive-fonts-recommended \
            texlive-fonts-extra \
            texlive-bibtex-extra \
            texlive-pictures \
            lmodern \
            cm-super

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-runtime.txt -r requirements-artifacts.txt
          pip install pypdf

      - name: Verify Theorem-to-Code Bridge & Generate Map
        run: python scripts/verify_theorem_code_bridge.py

      - name: Compile Journal of Finance Submission Manuscript
        working-directory: paper
        run: |
          pdflatex -interaction=nonstopmode Machine_Markets_JF_Submission.tex
          pdflatex -interaction=nonstopmode Machine_Markets_JF_Submission.tex

      - name: Compile Ceiling Suite Paper 1, Paper 2, QE and JF Versions
        run: |
          (cd ceiling_suite/paper1 && pdflatex -interaction=nonstopmode paper1.tex && pdflatex -interaction=nonstopmode paper1.tex)
          (cd ceiling_suite/paper2 && pdflatex -interaction=nonstopmode paper2.tex && pdflatex -interaction=nonstopmode paper2.tex)
          python ceiling_suite/papers/versions/build_versions.py

      - name: Upload Submission PDF Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Machine_Markets_JF_Submission
          path: paper/Machine_Markets_JF_Submission.pdf
          if-no-files-found: error

  thesis-release:
    name: Thesis numbers, package regression tests and current PDF
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install thesis dependencies
        run: |
          pip install -r requirements-runtime.txt -r requirements-artifacts.txt pypdf
          pip install --no-deps ./margin_monitor
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends texlive-latex-base texlive-latex-recommended texlive-latex-extra texlive-fonts-recommended lmodern poppler-utils
      - name: Verify frozen evidence and thesis results without opening experiments
        run: |
          python thesis/verify_thesis_numbers.py
          python thesis/checks/check_b2_supplement.py --check
          python scripts/verify_thesis_release.py
      - name: Run margin-monitor regressions
        run: pytest margin_monitor/tests -q
      - name: Verify committed PDF, then build and verify current sources
        run: |
          python scripts/verify_thesis_release.py --pdf
          sh thesis/build_thesis.sh
          python scripts/verify_thesis_release.py --pdf
          python scripts/package_thesis.py --seal --zip
      - name: Upload thesis and release checks
        uses: actions/upload-artifact@v4
        with:
          name: thesis-release
          path: |
            thesis/thesis.pdf
            thesis/checks/B2_supplement.json
            thesis/checks/registered_artifacts_sha256.json
            thesis/READINESS.md
            thesis/SUBMISSION_MANIFEST.json
            thesis/submission/Thesis_Review_Package_20261026.zip
            thesis/submission/Thesis_Review_Package_20261026.zip.sha256
          if-no-files-found: error
