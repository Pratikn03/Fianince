version: '3.8'

services:
  reproduce:
    build:
      context: .
      dockerfile: Dockerfile
    image: machine-markets:latest
    container_name: machine-markets-reproduce
    volumes:
      - ./results:/workspace/results
      - ./paper:/workspace/paper
    command: ["--mode", "fast"]

  reproduce-all:
    build:
      context: .
      dockerfile: Dockerfile
    image: machine-markets:latest
    container_name: machine-markets-reproduce-all
    volumes:
      - ./results:/workspace/results
      - ./paper:/workspace/paper
      - ./empirical_pipeline/data:/workspace/empirical_pipeline/data:ro
    command: ["--mode", "all"]
