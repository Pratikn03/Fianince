[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "agentic-guard"
version = "1.0.0"
description = "Universal Pre-Trade Agentic AI Safety Standard (AMIP RFC-001) & Dynamic Feedback Invariant Engine"
readme = "README.md"
requires-python = ">=3.9"
license = {text = "Apache-2.0"}
authors = [
    {name = "Machine Markets Core Research & Engineering Team"}
]
keywords = [
    "agentic-ai",
    "market-microstructure",
    "financial-stability",
    "pre-trade-risk",
    "formal-verification",
    "lean4",
    "basel-iii",
    "conic-optimization"
]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Financial and Insurance Industry",
    "Intended Audience :: Science/Research",
    "Topic :: Scientific/Engineering :: Mathematics",
    "Topic :: Office/Business :: Financial :: Investment",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]
dependencies = [
    "numpy>=1.24.0",
    "scipy>=1.10.0",
    "pandas>=2.0.0",
    "matplotlib>=3.7.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4.0",
    "pytest-cov>=4.1.0",
    "ruff>=0.1.0",
]
paper = [
    "pypdf>=3.17.0",
    "python-docx>=1.1.0",
]
all = [
    "pytest>=7.4.0",
    "pytest-cov>=4.1.0",
    "pypdf>=3.17.0",
    "python-docx>=1.1.0",
]

[project.scripts]
amip-reproduce = "reproduce:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["agentic_guard*", "simulations*", "production_runtime*", "research_extension*"]

[tool.pytest.ini_options]
minversion = "7.0"
addopts = "-q"
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 120
target-version = "py310"
exclude = [
    ".git",
    ".venv",
    "__pycache__",
    "empirical_pipeline/data",
    "scratch",
    "archive",
    "studies",
    "reference_directory",
    "tmp",
]

[tool.ruff.lint]
select = [
    "E9",   # Syntax and runtime errors
    "F63",  # Assertions and boolean operations
    "F7",   # Syntax features
    "F82",  # Undefined names and variable scoping
]

[tool.ruff.lint.per-file-ignores]
"ceiling_suite/p10b/**/*.py" = ["F821"]
"ceiling_suite/p11/**/*.py" = ["F821"]
"ceiling_suite/p12/**/*.py" = ["F821"]
"ceiling_suite/p13/**/*.py" = ["F821"]
"ceiling_suite/p14/**/*.py" = ["F821"]

