[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "margin-monitor"
version = "0.1.0"
description = "Certify a market's stability margin from public prices and anonymous order flow, without identifying traders"
readme = "README.md"
requires-python = ">=3.9"
license = {text = "Apache-2.0"}
authors = [{name = "Pratik Niroula"}]
dependencies = ["numpy>=1.22", "pandas>=1.5"]
keywords = ["market microstructure", "financial stability", "feedback", "AI agents", "supervision"]

[project.optional-dependencies]
test = ["pytest"]

[project.scripts]
margin-monitor = "margin_monitor.cli:main"

[tool.setuptools]
packages = ["margin_monitor"]
